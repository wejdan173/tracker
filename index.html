<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawwy Request Tracker</title>
  <style>
    :root {
      --primary-bg: #0d1117;
      --card-bg: #161b22;
      --accent: #ff5a00; /* Jawwy Orange */
      --accent-hover: #e04f00;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --input-bg: #0d1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--primary-bg); color: var(--text); padding: 25px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }

    /* Header & Stats */
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; text-transform: uppercase; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .stat-card div { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .stat-card span { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Tabs */
    .nav-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
    .tab-btn { padding: 12px 24px; border: none; background: none; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form & Cards */
    .card { background: var(--card-bg); padding: 25px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .form-group input { padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--accent); }

    button.btn-primary { background: var(--accent); color: #ffffff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; width: 100%; }
    button.btn-primary:hover { background: var(--accent-hover); }

    /* Search */
    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 14px 18px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; }
    .search-box input:focus { border-color: var(--accent); }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    th { background: rgba(13, 17, 23, 0.8); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }

    .copy-btn { background: var(--input-bg); border: 1px solid var(--border); color: var(--accent); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
    .copy-btn:hover { background: var(--accent); color: #ffffff; }

    .loading { text-align: center; padding: 30px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Jawwy Request Tracker</h1>
  </header>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div id="stat-total">0</div><span>Total Cases</span></div>
    <div class="stat-card"><div id="stat-open">0</div><span>Open Cases</span></div>
  </div>

  <!-- Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('add', event)">➕ Add New Case</button>
    <button class="tab-btn" onclick="switchTab('search', event)">🔎 Search Case</button>
    <button class="tab-btn" onclick="switchTab('all', event)">📋 All Cases</button>
  </div>

  <!-- Tab: Add Case -->
  <div id="tab-add" class="tab-content active">
    <div class="card">
      <form id="caseForm" onsubmit="submitCase(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" required placeholder="e.g. Ahmed Ali">
          </div>
          <div class="form-group">
            <label>Customer Number</label>
            <input type="text" id="customerNumber" required placeholder="e.g. 05XXXXXXXX">
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Case / Request Number</label>
            <input type="text" id="caseNumber" required placeholder="e.g. 1-123456789">
          </div>
        </div>
        <button type="submit" class="btn-primary" id="subBtn">Add Case</button>
      </form>
    </div>
  </div>

  <!-- Tab: Search Case -->
  <div id="tab-search" class="tab-content">
    <div class="search-box">
      <input type="text" id="searchInput" oninput="filterCases()" placeholder="Search by customer name, mobile number, or case ID...">
    </div>
    <div class="card table-container">
      <table>
        <thead>
          <tr>
            <th>Customer Name</th>
            <th>Customer Number</th>
            <th>Case Number</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="searchResults">
          <tr><td colspan="4" class="loading">Type in search box to display results...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tab: All Cases -->
  <div id="tab-all" class="tab-content">
    <div class="card table-container">
      <table>
        <thead>
          <tr>
            <th>Customer Name</th>
            <th>Customer Number</th>
            <th>Case Number</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="allResults">
          <tr><td colspan="4" class="loading">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz0m6AqmckukXCeKSKzd-slVnncJX7AUEzGtxitq2hBiaqbkpQd3F407X1T9yKeKbex/exec";

  let allData = [];

  window.onload = loadData;

  function switchTab(tabName, evt) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(evt) evt.target.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  async function loadData() {
    try {
      const res = await fetch(API_URL);
      allData = await res.json();
      updateStats();
      renderAllTable();
    } catch (err) {
      console.error(err);
    }
  }

  function updateStats() {
    document.getElementById('stat-total').innerText = allData.length;
    document.getElementById('stat-open').innerText = allData.length;
  }

  function renderAllTable() {
    const tbody = document.getElementById('allResults');
    if(allData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found</td></tr>';
      return;
    }
    tbody.innerHTML = allData.map(row => `
      <tr>
        <td><b>${row['Customer Name'] || ''}</b></td>
        <td>${row['Customer Number'] || ''}</td>
        <td><code>${row['Case Number'] || ''}</code></td>
        <td><button class="copy-btn" onclick="copyText('${row['Case Number']}')">Copy Case</button></td>
      </tr>
    `).join('');
  }

  function filterCases() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const tbody = document.getElementById('searchResults');
    
    if(!q) {
      tbody.innerHTML = '<tr><td colspan="4" class="loading">Type in search box to display results...</td></tr>';
      return;
    }

    const filtered = allData.filter(d => 
      (d['Customer Name'] && d['Customer Name'].toString().toLowerCase().includes(q)) ||
      (d['Customer Number'] && d['Customer Number'].toString().toLowerCase().includes(q)) ||
      (d['Case Number'] && d['Case Number'].toString().toLowerCase().includes(q))
    );

    if(filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No matching cases found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(row => `
      <tr>
        <td><b>${row['Customer Name'] || ''}</b></td>
        <td>${row['Customer Number'] || ''}</td>
        <td><code>${row['Case Number'] || ''}</code></td>
        <td><button class="copy-btn" onclick="copyText('${row['Case Number']}')">Copy Case</button></td>
      </tr>
    `).join('');
  }

  async function submitCase(e) {
    e.preventDefault();
    const subBtn = document.getElementById('subBtn');
    subBtn.innerText = "Saving...";
    subBtn.disabled = true;

    const payload = {
      customerName: document.getElementById('customerName').value,
      customerNumber: document.getElementById('customerNumber').value,
      caseNumber: document.getElementById('caseNumber').value
    };

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("✅ Case saved successfully!");
      document.getElementById('caseForm').reset();
      setTimeout(loadData, 1000);
    } catch (err) {
      alert("Error saving case!");
      console.error(err);
    } finally {
      subBtn.innerText = "Add Case";
      subBtn.disabled = false;
    }
  }

  function copyText(text) {
    navigator.clipboard.writeText(text);
    alert(`Copied Case Number: ${text}`);
  }
</script>

</body>
</html>
