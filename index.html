<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Request Tracker</title>
  <style>
    :root {
      --primary-bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #eab308;
      --input-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--primary-bg); color: var(--text); padding: 25px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }

    /* Header & Stats */
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .stat-card div { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .stat-card span { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Tabs */
    .nav-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
    .tab-btn { padding: 12px 24px; border: none; background: none; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form & Cards */
    .card { background: var(--card-bg); padding: 25px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { grid-column: 1 / -1; resize: vertical; height: 80px; }

    button.btn-primary { background: var(--accent); color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
    button.btn-primary:hover { background: var(--accent-hover); color: #ffffff; }

    /* Search */
    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 14px 18px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; }
    .search-box input:focus { border-color: var(--accent); }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    th { background: rgba(15, 23, 42, 0.6); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
    .badge-open { background: rgba(234, 179, 8, 0.15); color: var(--warning); border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-closed { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }

    .copy-btn { background: var(--input-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
    .copy-btn:hover { background: var(--border); color: var(--text); }

    .loading { text-align: center; padding: 30px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>External Request Tracker</h1>
  </header>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div id="stat-total">0</div><span>Total Cases</span></div>
    <div class="stat-card"><div id="stat-open" style="color: var(--warning);">0</div><span>Open Cases</span></div>
    <div class="stat-card"><div id="stat-closed" style="color: var(--success);">0</div><span>Closed Cases</span></div>
  </div>

  <!-- Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('add', event)">➕ Add New Case</button>
    <button class="tab-btn" onclick="switchTab('search', event)">🔎 Search Case</button>
    <button class="tab-btn" onclick="switchTab('all', event)">📋 All Cases</button>
  </div>

  <!-- Tab: Add Case -->
  <div id="tab-add" class="tab-content active">
    <div class="card">
      <form id="caseForm" onsubmit="submitCase(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" required placeholder="e.g. Ahmed Ali">
          </div>
          <div class="form-group">
            <label>Customer Number</label>
            <input type="text" id="customerNumber" required placeholder="e.g. 05XXXXXXXX">
          </div>
          <div class="form-group">
            <label>Case / Request Number</label>
            <input type="text" id="caseNumber" required placeholder="e.g. INC123456">
          </div>
          <div class="form-group">
            <label>Case Title / Subject</label>
            <input type="text" id="subject" required placeholder="e.g. Refund Request">
          </div>
          <div class="form-group">
            <label>Created By</label>
            <input type="text" id="createdBy" required placeholder="Your Name">
          </div>
          <div class="form-group">
            <label>Shift</label>
            <select id="shift">
              <option value="Morning">Morning</option>
              <option value="Evening">Evening</option>
              <option value="Night">Night</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="date">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Notes (Optional)</label>
            <textarea id="notes" placeholder="Additional details..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="subBtn">Add Case</button>
      </form>
    </div>
  </div>

  <!-- Tab: Search Case -->
  <div id="tab-search" class="tab-content">
    <div class="search-box">
      <input type="text" id="searchInput" oninput="filterCases()" placeholder="Search by customer name, phone number, or case ID...">
    </div>
    <div class="card table-container">
      <table id="searchTable">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Customer No.</th>
            <th>Case No.</th>
            <th>Subject</th>
            <th>Created By</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="searchResults">
          <tr><td colspan="8" class="loading">Type in search box to display results...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tab: All Cases -->
  <div id="tab-all" class="tab-content">
    <div class="card table-container">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Customer No.</th>
            <th>Case No.</th>
            <th>Subject</th>
            <th>Created By</th>
            <th>Shift</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="allResults">
          <tr><td colspan="9" class="loading">Loading data from Google Sheets...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz0m6AqmckukXCeKSKzd-slVnncJX7AUEzGtxitq2hBiaqbkpQd3F407X1T9yKeKbex/exec";

  let allData = [];

  document.getElementById('date').valueAsDate = new Date();
  window.onload = loadData;

  function switchTab(tabName, evt) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(evt) evt.target.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  async function loadData() {
    try {
      const res = await fetch(API_URL);
      allData = await res.json();
      updateStats();
      renderAllTable();
    } catch (err) {
      console.error(err);
    }
  }

  function updateStats() {
    document.getElementById('stat-total').innerText = allData.length;
    const openCount = allData.filter(d => d.Status === 'Open').length;
    document.getElementById('stat-open').innerText = openCount;
    document.getElementById('stat-closed').innerText = allData.length - openCount;
  }

  function renderAllTable() {
    const tbody = document.getElementById('allResults');
    if(allData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">No records found</td></tr>';
      return;
    }
    tbody.innerHTML = allData.map(row => `
      <tr>
        <td><b>${row['Customer Name'] || ''}</b></td>
        <td>${row['Customer Number'] || ''}</td>
        <td><code>${row['Case Number'] || ''}</code></td>
        <td>${row['Subject'] || ''}</td>
        <td>${row['Created By'] || ''}</td>
        <td>${row['Shift'] || ''}</td>
        <td>${row['Date'] ? row['Date'].toString().split('T')[0] : ''}</td>
        <td><span class="badge ${row['Status'] === 'Open' ? 'badge-open' : 'badge-closed'}">${row['Status']}</span></td>
        <td><button class="copy-btn" onclick="copyText('${row['Case Number']}')">Copy</button></td>
      </tr>
    `).join('');
  }

  function filterCases() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const tbody = document.getElementById('searchResults');
    
    if(!q) {
      tbody.innerHTML = '<tr><td colspan="8" class="loading">Type in search box to display results...</td></tr>';
      return;
    }

    const filtered = allData.filter(d => 
      (d['Customer Name'] && d['Customer Name'].toString().toLowerCase().includes(q)) ||
      (d['Customer Number'] && d['Customer Number'].toString().toLowerCase().includes(q)) ||
      (d['Case Number'] && d['Case Number'].toString().toLowerCase().includes(q))
    );

    if(filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No matching cases found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(row => `
      <tr>
        <td><b>${row['Customer Name'] || ''}</b></td>
        <td>${row['Customer Number'] || ''}</td>
        <td><code>${row['Case Number'] || ''}</code></td>
        <td>${row['Subject'] || ''}</td>
        <td>${row['Created By'] || ''}</td>
        <td>${row['Date'] ? row['Date'].toString().split('T')[0] : ''}</td>
        <td><span class="badge ${row['Status'] === 'Open' ? 'badge-open' : 'badge-closed'}">${row['Status']}</span></td>
        <td><button class="copy-btn" onclick="copyText('${row['Case Number']}')">Copy</button></td>
      </tr>
    `).join('');
  }

  async function submitCase(e) {
    e.preventDefault();
    const subBtn = document.getElementById('subBtn');
    subBtn.innerText = "Saving...";
    subBtn.disabled = true;

    const payload = {
      customerName: document.getElementById('customerName').value,
      customerNumber: document.getElementById('customerNumber').value,
      caseNumber: document.getElementById('caseNumber').value,
      subject: document.getElementById('subject').value,
      createdBy: document.getElementById('createdBy').value,
      shift: document.getElementById('shift').value,
      date: document.getElementById('date').value,
      status: document.getElementById('status').value,
      notes: document.getElementById('notes').value
    };

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("✅ Case saved successfully!");
      document.getElementById('caseForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      setTimeout(loadData, 1000);
    } catch (err) {
      alert("Error saving case!");
      console.error(err);
    } finally {
      subBtn.innerText = "Add Case";
      subBtn.disabled = false;
    }
  }

  function copyText(text) {
    navigator.clipboard.writeText(text);
    alert(`Copied Case Number: ${text}`);
  }
</script>

</body>
</html>
